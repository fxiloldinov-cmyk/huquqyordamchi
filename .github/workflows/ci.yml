name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HK_DEV_MEMORY_STORE: '1'
      HK_INTERNATIONAL_ENABLED: '0'
      GEMINI_API_KEY: ''
      API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run eval
