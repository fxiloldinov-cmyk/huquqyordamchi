# Yangi matn data/review/candidates ga tushadi; data/laws/archive avvalgi nusxalar uchundir.
# Jadval kodi mavjudligi uning ishga tushganini isbotlamaydi; Actions jurnalini tekshiring.
name: Qonunlar bazasini yangilash
on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: law-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.14.3
      - run: npm ci
      - name: Lex.uz auditi (faqat tekshirish)
        run: node scripts/check-law-updates.mjs --check-only
      - run: python3 scripts/compare-law-texts.py
      - run: npm run build
      - run: npm test
      - name: Audit dalillarini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            law-update-report.md
            data/source-status.json
            data/review/
          retention-days: 90
      - name: Audit natijalarini ko‘rib chiqish uchun PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: law-audit
          commit-message: 'Manbalar auditi va tekshiruv navbati'
          title: 'Manbalar auditi: sanalar va tekshiruv navbati'
          body-path: law-update-report.md
          add-paths: |
            data/source-status.json
            data/review/inventory.json
            data/review/source-queue.json
            public/coverage.json
            law-update-report.md
